[package]
name = "serpent-server"
version = "1.0.0"
edition = "2021"
description = "Serpent.io online server: the offline game's C simulation (native) + Rust networking"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
futures-util = "0.3"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
